name: 'Repository Hygiene'

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: 'read'
  pull-requests: 'read'

jobs:
  repository-hygiene:
    uses: 'JorisJonkers-dev/github-workflows/.github/workflows/repository-hygiene-guard.yml@183d218b87bcbbc2a21dddd51340828fb8cbc027' # v0.45.0
    with:
      package-proxy-guard: 'enforce'
    secrets: 'inherit'
