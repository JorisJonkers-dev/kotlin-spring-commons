name: 'Publish'

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: 'read'
  packages: 'write'

jobs:
  publish:
    runs-on: 'ubuntu-latest'
    steps:
      - uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1' # v7.0.1
      - uses: 'JorisJonkers-dev/github-workflows/actions/setup-java-gradle@38aa4e9ea4a2adfdcfc210967f540023e05bca07' # v0.48.0
        with:
          java-version: '21.0.12+8.0.LTS'
          packages-proxy-token: ${{ secrets.PACKAGES_PROXY_TOKEN }}
          require-package-proxy: true
      - name: 'Publish'
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew publish --no-daemon --no-parallel --max-workers=1
